name: ci-cd
"on":
  push:
    branches:
      - master

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set IMAGE_NAME (lowercase)
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "IMAGE_NAME=ghcr.io/$REPO_LC" >> $GITHUB_ENV
          echo "Using IMAGE_NAME=$IMAGE_NAME"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "$IMAGE_NAME:commit-${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Push image
        run: |
          docker push "$IMAGE_NAME:commit-${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    steps:
      - name: Compute IMAGE tag
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$REPO_LC:latest" >> $GITHUB_ENV
          echo "Deploying IMAGE=$IMAGE"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/app
            echo "IMAGE=${IMAGE}" > .env    # compose variable substitution
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose down || true
            docker compose pull
            docker compose up -d
            docker ps --format "table {{.Image}}\t{{.Ports}}\t{{.Names}}"
            docker image prune -f
