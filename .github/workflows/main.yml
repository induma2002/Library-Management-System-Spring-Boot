name: ci-cd
on:
  push:
    branches: [ "master" ]   # runs when you push to master

jobs:
  build_and_push_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed for GHCR
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Compute lowercase image name and export as env
      - name: Set IMAGE_NAME
        id: imagename
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"         # lowercase owner/repo
          echo "IMAGE_NAME=ghcr.io/$REPO_LC" >> $GITHUB_ENV
          echo "IMAGE_NAME=ghcr.io/$REPO_LC"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_NAME:commit-${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:commit-${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

  deploy_to_ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build_and_push_image
    steps:
      - name: Set IMAGE (lowercase)
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "IMAGE=ghcr.io/$REPO_LC:latest" >> $GITHUB_ENV
          echo "IMAGE=ghcr.io/$REPO_LC:latest"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/app
            cd ~/app

            # Create compose file if missing
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml <<'YML'
            services:
              api:
                image: ${IMAGE}
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - .env
            YML
            fi

            # Pass image from CI to compose
            echo IMAGE=${IMAGE} > .env.ci

            # Login & deploy
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            export IMAGE=${IMAGE}
            docker compose pull
            docker compose up -d
            docker image prune -f
