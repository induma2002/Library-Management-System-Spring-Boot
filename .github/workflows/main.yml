name: ci-cd
on:
  push:
    branches: [ "master" ]   # 👈 runs only when you push to master

jobs:
  build_and_push_image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required for GHCR
    env:
      IMAGE_NAME: ghcr.io/${{ toLower(github.repository) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-stage Docker image
        run: |
          docker build -t $IMAGE_NAME:commit-${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Push Docker image to GHCR
        run: |
          docker push $IMAGE_NAME:commit-${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy_to_ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build_and_push_image
    env:
      IMAGE: ghcr.io/${{ toLower(github.repository) }}:latest
    steps:
      - name: Connect and deploy on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "=== Setting up app directory ==="
            mkdir -p ~/app
            cd ~/app

            # If compose file doesn't exist, create one
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml <<'YML'
            services:
              api:
                image: ${IMAGE}
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - .env
            YML
            fi

            echo "=== Setting image variable ==="
            echo IMAGE=${{ env.IMAGE }} > .env.ci

            echo "=== Docker login to GHCR ==="
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            echo "=== Pulling latest image and starting container ==="
            export IMAGE=${{ env.IMAGE }}
            docker compose pull
            docker compose up -d

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "✅ Deployment complete!"
