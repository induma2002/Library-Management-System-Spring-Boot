name: ci-cd
on:
  push:
    branches: [ "master" ]   # change if your default branch is different

jobs:
  build_and_push_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # needed for GHCR
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # Optional: cache Maven so Docker build is faster (uses your Dockerfile's mvnw)
      - name: Set up JDK (for cache priming only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (multi-stage Dockerfile)
        run: |
          docker build -t $IMAGE_NAME:commit-${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Push image
        run: |
          docker push $IMAGE_NAME:commit-${{ github.sha }}
          docker push $IMAGE_NAME:latest

  deploy_to_ec2:
    runs-on: ubuntu-latest
    needs: build_and_push_image
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
    steps:
      - name: Copy docker-compose (optional if you already have it on server)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy/*"
          target: "~/app"
        continue-on-error: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            mkdir -p ~/app
            cd ~/app

            # write compose if missing
            if [ ! -f docker-compose.yml ]; then
              cat > docker-compose.yml <<'YML'
            services:
              api:
                image: ${IMAGE}
                restart: unless-stopped
                ports:
                  - "8080:8080"
                env_file:
                  - .env
            YML
            fi

            # pass image tag from CI to compose via .env.ci
            echo IMAGE=${{ env.IMAGE_NAME }} > .env.ci

            # login + pull + restart
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            export IMAGE=${{ env.IMAGE_NAME }}
            docker compose pull
            docker compose up -d
            docker image prune -f
